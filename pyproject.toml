[project]
name = "filingiq"
version = "0.1.0"
description = "Auditable multi-agent Q&A over SEC filings, grounded in XBRL structured data."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.139.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "python-dotenv>=1.2.2",
    "selectolax>=0.4.10",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
# Added in later phases (RAG, embeddings, agents). Kept out of the base install
# so the ingestion smoke test stays fast and torch-free.
rag = [
    "lancedb>=0.13",
    "fastembed>=0.4",
]

[tool.uv]
# Virtual project: uv manages the venv + deps but does not build/install this
# package itself. Scripts add ./src to sys.path.
package = false
